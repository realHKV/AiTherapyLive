services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: therapyai
      POSTGRES_USER: therapyai_user
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U therapyai_user -d therapyai"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "local_dev_only"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "local_dev_only", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
