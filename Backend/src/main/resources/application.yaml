spring:
  application:
    name: AiTherapy

  jackson:
    use-jackson2-defaults: true

  # ─── Database ────────────────────────────────────────────────────────────────
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/therapyai}
    username: ${DATABASE_USER:therapyai_user}
    password: ${DATABASE_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ─── JPA / Hibernate ─────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only validates
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  # ─── Flyway ──────────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # ─── Redis ───────────────────────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}    # Set to true in production (Upstash requires TLS)
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

  session:
    data:
      redis:
        namespace: aitherapy:oauth-session

  lifecycle:
    timeout-per-shutdown-phase: 20s
  task:
    scheduling:
      pool:
        size: 2
      shutdown:
        await-termination: true
        await-termination-period: 10s
    execution:
      shutdown:
        await-termination: true
        await-termination-period: 10s


  # ─── Security / OAuth2 ───────────────────────────────────────────────────────
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-client-secret}
            scope: openid, email, profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
            user-name-attribute: sub

# ─── JWT ─────────────────────────────────────────────────────────────────────
jwt:
  private-key: ${JWT_PRIVATE_KEY:}         # RSA private key (PEM, base64 encoded)
  public-key: ${JWT_PUBLIC_KEY:}           # RSA public key (PEM, base64 encoded)
  access-token-expiry: 900                 # 15 minutes (seconds)
  refresh-token-expiry: 2592000            # 30 days (seconds)

# ─── Encryption ──────────────────────────────────────────────────────────────
encryption:
  master-key: ${ENCRYPTION_MASTER_KEY:}   # 32-byte base64 key — NEVER hardcode in production

# ─── AI Provider ─────────────────────────────────────────────────────────────
ai:
  bedrock:
    enabled: ${AI_BEDROCK_ENABLED:false}
    region: ${BEDROCK_REGION:}
    connect-timeout: ${BEDROCK_CONNECT_TIMEOUT:2s}
    api-call-timeout: ${BEDROCK_API_CALL_TIMEOUT:45s}
    api-call-attempt-timeout: ${BEDROCK_API_CALL_ATTEMPT_TIMEOUT:40s}
  usage:
    policy-id: ${AI_USAGE_POLICY_ID:beta-v1}
    region: ${BEDROCK_REGION:unconfigured}
    free:
      daily-requests: ${AI_USAGE_FREE_DAILY_REQUESTS:20}
      daily-tokens: ${AI_USAGE_FREE_DAILY_TOKENS:24000}
      per-minute-requests: ${AI_USAGE_FREE_PER_MINUTE_REQUESTS:5}
    pro:
      daily-requests: ${AI_USAGE_PRO_DAILY_REQUESTS:60}
      daily-tokens: ${AI_USAGE_PRO_DAILY_TOKENS:100000}
      per-minute-requests: ${AI_USAGE_PRO_PER_MINUTE_REQUESTS:10}
    account:
      daily-requests: ${AI_USAGE_ACCOUNT_DAILY_REQUESTS:1000}
      daily-tokens: ${AI_USAGE_ACCOUNT_DAILY_TOKENS:1000000}
    model:
      daily-requests: ${AI_USAGE_MODEL_DAILY_REQUESTS:500}
      daily-tokens: ${AI_USAGE_MODEL_DAILY_TOKENS:500000}
    lease-seconds: ${AI_USAGE_LEASE_SECONDS:120}
  routing:
    enabled: ${AI_ROUTING_ENABLED:false}
    policy-id: ${AI_ROUTING_POLICY_ID:}
    free-model-id: ${BEDROCK_FREE_MODEL_ID:}
    pro-model-id: ${BEDROCK_PRO_MODEL_ID:}
    summary-model-id: ${BEDROCK_SUMMARY_MODEL_ID:}
  chat:
    v2:
      enabled: ${AI_CHAT_V2_ENABLED:false}
    workers: ${AI_CHAT_WORKERS:8}
    queue-capacity: ${AI_CHAT_QUEUE_CAPACITY:64}
    stream-timeout: ${AI_CHAT_STREAM_TIMEOUT:90s}
    first-token-timeout: ${AI_CHAT_FIRST_TOKEN_TIMEOUT:15s}
    total-timeout: ${AI_CHAT_TOTAL_TIMEOUT:60s}
    max-input-tokens: ${AI_CHAT_MAX_INPUT_TOKENS:6000}
    max-output-tokens: ${AI_CHAT_MAX_OUTPUT_TOKENS:1500}
  extraction:
    worker-enabled: ${AI_EXTRACTION_WORKER_ENABLED:false}
    poll-interval-ms: ${AI_EXTRACTION_POLL_INTERVAL_MS:5000}
    policy-version: ${AI_EXTRACTION_POLICY_VERSION:session-extraction-v1}
    max-attempts: ${AI_EXTRACTION_MAX_ATTEMPTS:5}
    lease: ${AI_EXTRACTION_LEASE:PT2M}
    max-output-tokens: ${AI_EXTRACTION_MAX_OUTPUT_TOKENS:1800}
  limits:
    messages-per-hour: 20
    context-messages: 20
    memory-items-in-prompt: 8
    system-prompt-max-tokens: 600

# ─── CORS ────────────────────────────────────────────────────────────────────
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ─── Logging ─────────────────────────────────────────────────────────────────
logging:
  structured:
    format:
      console: logstash
  level:
    com.hkv.AiTherapy: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

# ─── Server ──────────────────────────────────────────────────────────────────
server:
  port: 8080
  forward-headers-strategy: native
  shutdown: graceful
  servlet:
    session:
      timeout: 5m
    context-path: /api/v1
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never
      group:
        readiness:
          include: readinessState,db,redis
        liveness:
          include: livenessState
  health:
    bedrock:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}

# ─── Razorpay ────────────────────────────────────────────────────────────────────────────────
razorpay:
  key-id: ${RAZORPAY_KEY_ID:}            # rzp live/test key id
  key-secret: ${RAZORPAY_KEY_SECRET:}    # rzp live/test key secret
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}  # set in Razorpay dashboard → Webhooks

# ─── App flags ───────────────────────────────────────────────────────────────────────────────
app:
  dev-mode: ${DEV_MODE:false}   # set to true in .env to enable /dev/* endpoints
  auth:
    oauth-ticket-handoff: ${OAUTH_TICKET_HANDOFF:false}
