name: Backend tests

on:
  push:
    branches: [main, 'codex/**']
    paths:
      - 'Backend/**'
      - '.github/workflows/backend-tests.yml'
      - '.github/workflows/backend-release.yml'
      - '.github/workflows/backend-demo-deploy.yml'
  pull_request:
    paths:
      - 'Backend/**'
      - '.github/workflows/backend-tests.yml'
      - '.github/workflows/backend-release.yml'
      - '.github/workflows/backend-demo-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.2
      - name: Validate demo infrastructure without AWS credentials
        working-directory: Backend/infra/demo
        run: |
          terraform fmt -check
          terraform init -backend=false -input=false
          terraform validate
          terraform test
      - name: Check deployment script syntax
        run: bash -n Backend/deploy/demo-release.sh Backend/deploy/demo-update.sh Backend/deploy/demo-smoke.sh

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: Backend/pom.xml
      - name: Run backend tests with PostgreSQL and Redis containers
        working-directory: Backend
        run: bash ./mvnw -B verify

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build the application and migrator image
        run: docker build --pull --tag aitherapy:ci Backend
      - name: Scan backend dependencies
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: Backend
          scanners: vuln
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL
      - name: Check container user and migration configuration errors
        run: |
          test "$(docker run --rm --entrypoint id aitherapy:ci -u)" = '10001'
          set +e
          output=$(docker run --rm aitherapy:ci migrate 2>&1)
          status=$?
          set -e
          test "$status" -eq 2
          test "$output" = 'Missing required migration setting: DATABASE_URL'
      - name: Run migrator and application smoke test
        run: bash Backend/docker/smoke.sh aitherapy:ci
      - name: Scan container vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: aitherapy:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL
