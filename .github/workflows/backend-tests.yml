name: Backend tests

on:
  push:
    branches: ['codex/**']
    paths:
      - 'Backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'Backend/**'
      - '.github/workflows/backend-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: Backend/pom.xml
      - name: Run backend tests with PostgreSQL and Redis containers
        working-directory: Backend
        run: bash ./mvnw -B test
