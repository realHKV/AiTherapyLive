name: Export tested backend image for private SSM host

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  export:
    if: github.repository == 'realHKV/AiTherapyLive' && github.ref == 'refs/heads/codex/backend-baseline'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: backend-release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify the protected release identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          manifest=Backend/docs/releases/STEP-16-private-image.json
          image=$(jq -r .image "$manifest")
          digest=$(jq -r .digest "$manifest")
          commit=$(jq -r .commit "$manifest")
          test "$image" = 'realhkv/aitherapy-backend'
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          test "$(jq -r .platform "$manifest")" = 'linux/amd64'
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/backend-release.yml/runs?head_sha=$commit&event=push&per_page=100" \
            | jq -e --arg commit "$commit" 'any(.workflow_runs[]; .head_sha == $commit and .conclusion == "success")'
          printf 'IMAGE=%s@%s\n' "$image" "$digest" >> "$GITHUB_ENV"
      - uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Pull exact digest and package the image
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          test "$(docker image inspect -f '{{.Os}}/{{.Architecture}}' "$IMAGE")" = 'linux/amd64'
          docker save "$IMAGE" | gzip -1 > backend-image.tar.gz
          sha256sum backend-image.tar.gz > backend-image.tar.gz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-image-oci-a305911
          path: |
            backend-image.tar.gz
            backend-image.tar.gz.sha256
          if-no-files-found: error
          retention-days: 2
